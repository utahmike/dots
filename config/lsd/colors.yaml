# Melange theme for lsd
# Warm, dark colorscheme matching nvim/terminal configuration
# See: https://github.com/savq/melange-nvim
#
# Base:    bg #292522  black #34302C  selection #403A36  grey #867462
# Text:    fg #ECE1D7  dim #C1A78E
# Accents: red #BD8183  green #78997A  yellow #E49B5D  blue #7F91B2
#          magenta #B380B0  cyan #7B9695  bright-cyan #89B3B6  bright-yellow #EBC06D

user: "#89B3B6"
group: "#867462"

permission:
  read: "#78997A"
  write: "#EBC06D"
  exec: "#BD8183"
  exec-sticky: "#B380B0"
  no-access: "#867462"
  octal: "#7B9695"
  acl: "#89B3B6"
  context: "#7F91B2"

date:
  hour-old: "#78997A"
  day-old: "#89B3B6"
  older: "#7F91B2"

size:
  none: "#867462"
  small: "#78997A"
  medium: "#EBC06D"
  large: "#E49B5D"

inode:
  valid: "#7B9695"
  invalid: "#867462"

links:
  valid: "#7B9695"
  invalid: "#867462"

tree-edge: "#867462"

git-status:
  default: "#867462"
  unmodified: "#867462"
  ignored: "#867462"
  new-in-index: "#78997A"
  new-in-workdir: "#78997A"
  typechange: "#EBC06D"
  deleted: "#BD8183"
  renamed: "#89B3B6"
  modified: "#EBC06D"
  conflicted: "#BD8183"
