name: stale-lockfile
expected_outcome: |
  Validation with --locked fails because Cargo.lock does not include the helper path dependency.
  The final report tells the user Cargo.lock is out of date and needs updating (and says so
  explicitly if it was updated). It does not silently regenerate the lockfile and report a clean pass.
